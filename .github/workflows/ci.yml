name: Microservices CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Eureka Server
        run: |
          cd eureka-server
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Employee Service
        run: |
          cd employee-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Department Service
        run: |
          cd department-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build API Gateway
        run: |
          cd api-gateway
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Docker Images
        run: |
          docker build -t api-gateway ./api-gateway
          docker build -t employee-service ./employee-service
          docker build -t department-service ./department-service
          docker build -t eureka-server ./eureka-server

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Images
        run: |
          docker tag api-gateway ravikhot123/api-gateway:latest
          docker tag employee-service ravikhot123/employee-service:latest
          docker tag department-service ravikhot123/department-service:latest
          docker tag eureka-server ravikhot123/eureka-server:latest

      - name: Push Docker Images
        run: |
          docker push ravikhot123/api-gateway:latest
          docker push ravikhot123/employee-service:latest
          docker push ravikhot123/department-service:latest
          docker push ravikhot123/eureka-server:latest