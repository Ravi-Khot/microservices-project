name: Microservices CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Eureka Server
        run: |
          cd eureka-server
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Employee Service
        run: |
          cd employee-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Department Service
        run: |
          cd department-service
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build API Gateway
        run: |
          cd api-gateway
          chmod +x mvnw
          ./mvnw clean package -DskipTests