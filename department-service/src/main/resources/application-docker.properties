server.port=8082

# Docker DB
spring.datasource.url=${DEPARTMENT_DB_URL:jdbc:mysql://mysql:3306/departmentdb}
spring.datasource.username=${DEPARTMENT_DB_USERNAME}
spring.datasource.password=${DEPARTMENT_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Eureka Configuration
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka}
