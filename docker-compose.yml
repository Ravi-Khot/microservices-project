version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: employeedb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  eureka-server:
    build: ./eureka-server
    image: ravikhot/eureka-server:latest
    container_name: eureka-server
    restart: on-failure
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8761:8761"
    networks:
      - microservice-network

  employee-service:
    build: ./employee-service
    image: ravikhot/employee-service:latest
    container_name: employee-service
    restart: on-failure
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8081:8081"
    networks:
      - microservice-network

  department-service:
    build: ./department-service
    image: ravikhot/department-service:latest
    container_name: department-service
    restart: on-failure
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8082:8082"
    networks:
      - microservice-network

  api-gateway:
    build: ./api-gateway
    image: ravikhot/api-gateway:latest
    container_name: api-gateway
    restart: on-failure
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    networks:
      - microservice-network

volumes:
  mysql_data:

networks:
  microservice-network:
    driver: bridge